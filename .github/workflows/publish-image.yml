name: publish-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone the public Track 1 kit (for the sandbox base)
        run: git clone --depth 1 https://github.com/Agenthon-2026/track1-coding-public.git kit

      - name: Build the shared sandbox base
        run: docker build -t finance-bench-sandbox:latest -f kit/docker/sandbox.Dockerfile kit

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the agent image (linux/amd64, as the contract requires)
        id: build
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/agenthon-t1
          TAG=$IMAGE:${{ github.sha }}
          docker build --platform linux/amd64 -t "$TAG" .
          docker push "$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: The digest to paste into submission.json
        run: |
          echo "image.registry   = ghcr.io"
          echo "image.repository = ${{ github.repository_owner }}/agenthon-t1"
          echo "image.digest     = ${{ steps.build.outputs.digest }}"
